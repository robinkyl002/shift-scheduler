{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{block "title" .}}<title>Shift Scheduler</title>{{end}}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./static/css/styles.css">
    <link rel="stylesheet" href="./static/css/login.css">
    {{block "head" .}}{{end}}
</head>
<body>
    <header>
        <div id="title-bar">
            <h1 id="app-title">Shift Scheduler</h1>

            {{if .IsAuthenticated}}
            <form id="logout-form" hx-post="/logout" hx-target="main" hx-push-url="true">
                <button type="submit" class="default-button">Logout</button>
            </form>
            {{else}}    
            <a id="login-header-link"
                href="/login"
                hx-get="/login" 
                hx-target="main" 
                hx-push-url="true">Sign In</a>
            {{end}}
        </div>
        
        {{template "nav" .}}
    </header>

    <main>
        {{ block "content" . }}{{ end }}
    </main>

    <footer>
    </footer>

    <script src="/static/htmx.min.js"></script>
</html>
{{end}}
