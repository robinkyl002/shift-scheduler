{{define "content"}}
    <div id="schedule-container">
        <h2>Your Schedule</h2>
        <table id="schedule-table">
            <thead>
                <tr>
                    <th scope="col"></th>
                    {{range $hour := .Schedule.Hours}}
                        <th scope="col">{{ formatHour $hour}}</th>
                    {{end}}
                </tr>
            </thead>
            <tbody>
                {{range $day := $.Schedule.Days}}
                <tr>
                    <th scope="row">{{$day}}</th>
                    {{range $hour := $.Schedule.Hours}}
                        <td class="schedule-cell" data-day="{{$day}}" data-hour="{{$hour}}">
                            <div>
                            {{range sliceIndices $.Schedule.SlicesPerHour}}
                            <button
                                type="button"
                                class="slice"
                                data-day="{{$day}}"
                                data-hour="{{$hour}}"
                                data-slice="{{.}}">
                            </button>
                            {{end}}
                            </div>
                        </td>
                    {{end}}
                </tr>
                {{end}}
            </tbody>
        </table>

        <button id="submit-schedule" hx-post="/schedule/submit" hx-trigger="click" hx-target="#schedule-container" hx-swap="outerHTML">
            Submit Schedule
        </button>
    </div>
{{end}}
