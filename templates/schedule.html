{{define "content"}}
    <div id="schedule-container">
        <h2>Your Schedule</h2>
        <form id="schedule-form" hx-post="/schedule" hx-swap="none">
            <input type="hidden" name="selected-slots" id="selected-slots">

            {{template "week_view" .}}

            <button type="submit" class="default-button">
                Submit Schedule
            </button>
        </form>

        <div id="save-status"></div>
    </div>
{{end}}
